<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Identity Verification Tool</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      background-color: #204a96; /* page blue */
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background-color: #ffffff;
      width: 360px;
      padding: 40px 40px 32px 40px;
      box-shadow: 0 0 0 1px rgba(0,0,0,0.06), 0 2px 6px rgba(0,0,0,0.15);
      border-radius: 0;
      box-sizing: border-box;
      text-align: left;
    }
    .subtitle {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      color: #204a96;
      margin-bottom: 24px;
    }
    .instructions {
      font-size: 13px;
      color: #555555;
      margin-bottom: 20px;
      line-height: 1.4;
    }
    .field-label {
      font-size: 14px;
      margin-bottom: 6px;
      color: #1d1d1f;
    }
    .text-input {
      width: 100%;
      box-sizing: border-box;
      padding: 10px 12px;
      font-size: 14px;
      border: 1px solid #c7c7c7;
      border-radius: 3px;
      outline: none;
    }
    .text-input:focus {
      border-color: #1662dd;
      box-shadow: 0 0 0 1px #1662dd;
    }
    .button-primary {
      margin-top: 24px;
      width: 100%;
      padding: 12px 16px;
      background-color: #1662dd;
      color: #ffffff;
      border: none;
      border-radius: 3px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }
    .button-primary:hover {
      background-color: #1250b5;
    }
    .result {
      margin-top: 20px;
      font-size: 14px;
      font-weight: 500;
    }
    .disclaimer {
      margin-top: 8px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: #777777;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="subtitle">Identity Verification Tool</div>

    <div class="instructions">
      Use this tool to verify the identity of callers who are requesting
      protected actions on their account, such as password
      resets or account unlocks.
    </div>

    <div class="field-label">User login</div>
    <input type="text" id="login" class="text-input" placeholder="user@company.com" />

    <button id="pushButton" class="button-primary">Next</button>

    <div id="result" class="result"></div>
    <div class="disclaimer">For Authorized Use Only</div>
  </div>

  <script>
    const resultDiv = document.getElementById('result');
    const loginInput = document.getElementById('login');
    const pushButton = document.getElementById('pushButton');

    function mapStatusToMessage(status) {
      if (status === 'verified') {
        return 'Verified';
      }
      if (status === 'timeout') {
        return 'Request timed out, try again';
      }
      return 'Unable to Verify';
    }

    async function callApi(path, body) {
      resultDiv.textContent = 'Processing...';
      try {
        const resp = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        const data = await resp.json();
        const status = data.status || 'failed';
        resultDiv.textContent = mapStatusToMessage(status);
      } catch (err) {
        console.error(err);
        resultDiv.textContent = 'Error calling verification service';
      }
    }

    pushButton.addEventListener('click', () => {
      const login = loginInput.value.trim();
      if (!login) {
        resultDiv.textContent = 'Please enter a login';
        return;
      }
      callApi('/verify/push', { login });
    });
  </script>
</body>
</html>
